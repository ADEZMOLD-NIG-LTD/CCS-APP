name: CI/CD

on:
  push:
    branches: [main, master, staging, develop]
  pull_request:
    branches: [main, master, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator used by the security-rules tests needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Firestore security rules tests
        run: npm run test:rules

      # Compile check only (no secrets on pull requests); deploy builds use the real config.
      - name: Build (compile check)
        run: npm run build
        env:
          VITE_ALLOW_MOCK_BUILD: 'true'

  deploy:
    name: Build and deploy
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_COMMODITY_CONTROL_SYSTEM }}
      FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
      IS_LIVE: ${{ github.ref_name == 'main' || github.ref_name == 'master' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails if the Firebase web configuration is missing (see vite.config.ts).
      - name: Build web app
        run: npx vite build
        env:
          VITE_APP_ENV: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || secrets.FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_FIRESTORE_DATABASE_ID || secrets.FIREBASE_FIRESTORE_DATABASE_ID }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}

      # Rules are deployed before hosting so the new client never runs against old rules.
      # Non-production branches deploy rules only when their environment points at its own
      # Firebase project (set the FIRESTORE_DEPLOY variable to "true" on that environment).
      # Publishes through the Firebase Rules REST API. The firebase CLI would first call
      # serviceusage.services.get, which deploy service accounts normally may not do.
      - name: Deploy Firestore rules and indexes
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' && (env.IS_LIVE == 'true' || vars.FIRESTORE_DEPLOY == 'true') }}
        run: npx tsx scripts/deploy-firestore.ts
        env:
          FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_FIRESTORE_DATABASE_ID || secrets.FIREBASE_FIRESTORE_DATABASE_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          channelId: ${{ env.IS_LIVE == 'true' && 'live' || github.ref_name }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
