<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>(CCS) Commodity Control System</title>
  </head>
  <body>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
      .fade-in { animation: fadeIn 0.5s ease-out; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <div id="root">
      <div id="loading-screen" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #64748b; text-align: center; padding: 20px; background: #f8fafc;">
        <div style="width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px;"></div>
        <h1 style="font-size: 20px; margin: 0 0 8px 0; color: #1e293b; font-weight: 800; letter-spacing: -0.025em;">COMMODITY CONTROL SYSTEM</h1>
        <p style="font-size: 14px; margin: 0; color: #94a3b8; font-weight: 500;">Securing your connection to the cloud...</p>
        
        <!-- Diagnostic Console (shown on error or timeout) -->
        <div id="boot-diagnostics" style="display: none; margin-top: 40px; padding: 20px; background: white; border: 1px solid #e2e8f0; border-radius: 16px; max-width: 600px; text-align: left; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 90%;" class="fade-in">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
            <div style="background: #fee2e2; color: #ef4444; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">!</div>
            <h2 style="color: #1e293b; font-size: 15px; margin: 0; font-weight: 700;">System Boot Error</h2>
          </div>
          
          <div id="error-output" style="color: #ef4444; font-size: 12px; font-family: 'JetBrains Mono', 'Fira Code', monospace; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #f1f5f9; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto;"></div>
          
          <div style="background: #eff6ff; border: 1px solid #dbeafe; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <p style="color: #1e40af; font-size: 11px; font-weight: 600; margin: 0 0 8px 0;">WHAT YOU CAN TRY:</p>
            <ul style="color: #3b82f6; font-size: 11px; margin: 0; padding-left: 18px; line-height: 1.6;">
              <li>Check your internet connection and reload the page</li>
              <li>Update your browser, or try a different browser</li>
              <li>If the problem continues, contact your administrator with the message above</li>
            </ul>
          </div>

          <div style="display: flex; gap: 10px;">
            <button onclick="window.location.reload()" style="flex: 1; background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;">RELOAD</button>
          </div>
        </div>
      </div>
    </div>
    
    <script>
      (function() {
        const diags = document.getElementById('boot-diagnostics');
        const output = document.getElementById('error-output');
        
        function showError(msg) {
          if (diags && output) {
            diags.style.display = 'block';
            output.textContent = msg;
          }
        }

        // Only boot-time failures are shown here; once React renders, its ErrorBoundary takes over.
        function booting() {
          const root = document.getElementById('root');
          return !!root && !!document.getElementById('loading-screen');
        }

        window.onerror = function(msg) {
          if (booting()) showError(`The application failed to start: ${msg}`);
          return false;
        };

        window.onunhandledrejection = function(event) {
          if (booting()) showError(`The application failed to start: ${event.reason}`);
        };

        setTimeout(() => {
          const root = document.getElementById('root');
          if (booting()) {
            showError('The application is taking too long to start. This is usually a network problem.');
          } else if (root && root.innerHTML.trim() === '') {
            showError('The application stopped unexpectedly while loading.');
          }
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
